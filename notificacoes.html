<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notificações | Sistema de Gestão</title><link rel="stylesheet" href="layout.css"><style>.nt-actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.nt-item{padding:18px;border:1px solid var(--layout-border);border-radius:10px;margin:12px 0;overflow-wrap:anywhere}.nt-item.nova{border-left:4px solid #3b82f6}.nt-item h3{margin:0 0 8px;font-size:16px}.nt-item p{white-space:pre-wrap;line-height:1.6;margin:8px 0}.nt-item small{color:var(--layout-secondary)}</style></head><body class="sg-body"><div id="carregando" class="sg-carregando">Verificando sessão...</div><div id="app" hidden><header class="sg-cabecalho"><h1>Notificações</h1><p>Acompanhe as atualizações das suas solicitações.</p></header><section class="sg-card"><div class="nt-actions"><button id="ntLer" class="sg-btn">Marcar todas como lidas</button><button id="ntAtualizar" class="sg-btn sg-btn-secondary">Atualizar</button><a class="sg-btn sg-btn-secondary" href="ferias.html">Minhas férias</a></div><p id="ntStatus" role="status"></p><div id="ntLista"></div><div class="nt-actions"><button id="ntAnterior" class="sg-btn sg-btn-secondary">Anterior</button><button id="ntProxima" class="sg-btn sg-btn-secondary">Próxima</button></div></section></div><script type="module">
import {montarLayout} from './layout.js';import {supabase} from './supabase.js';import {erro} from './alertas.js';
const $=id=>document.getElementById(id);let pagina=0,versao=0,ocupado=false;const tamanho=30;
async function carregar(){const v=++versao;$('ntStatus').textContent='Carregando...';$('ntAnterior').disabled=true;$('ntProxima').disabled=true;try{const {data,error,count}=await supabase.from('notificacoes_portal').select('id,titulo,mensagem,criado_em,lida_em',{count:'exact'}).order('criado_em',{ascending:false}).order('id',{ascending:false}).range(pagina*tamanho,(pagina+1)*tamanho-1);if(v!==versao)return;if(error)throw error;$('ntLista').replaceChildren();$('ntStatus').textContent=count?count+' notificação(ões)':'Nenhuma notificação até o momento.';for(const n of data){const a=document.createElement('article');a.className='nt-item'+(n.lida_em?'':' nova');const t=document.createElement('h3');t.textContent=n.titulo+(n.lida_em?'':' • Nova');const p=document.createElement('p');p.textContent=n.mensagem;const d=document.createElement('small');d.textContent=new Date(n.criado_em).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'});a.append(t,p,d);$('ntLista').append(a);}$('ntAnterior').disabled=pagina===0;$('ntProxima').disabled=(pagina+1)*tamanho>=(count||0);}catch(e){if(v===versao)$('ntStatus').textContent='Erro: '+e.message;}}
const perfil=await montarLayout({titulo:'Notificações',pagina:'notificacoes'});if(perfil){$('ntAtualizar').onclick=carregar;$('ntAnterior').onclick=()=>{pagina=Math.max(0,pagina-1);carregar();};$('ntProxima').onclick=()=>{pagina++;carregar();};$('ntLer').onclick=async()=>{if(ocupado)return;ocupado=true;$('ntLer').disabled=true;try{const {error}=await supabase.rpc('ler_notificacoes_portal');if(error)throw error;window.dispatchEvent(new Event('sg-notificacoes-atualizar'));await carregar();}catch(e){await erro(e.message);}finally{ocupado=false;$('ntLer').disabled=false;}};await carregar();}
</script></body></html>
