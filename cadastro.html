
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Sistema de Gestão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-container">

        <div class="login-header">

            <div class="logo">
                <svg width="36" height="36" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="1.8">
                    <circle cx="9" cy="8" r="4"/>
                    <path d="M2 21v-3a7 7 0 0 1 14 0v3"/>
                    <path d="M19 8v6m-3-3h6"/>
                </svg>
            </div>

            <h1>Sistema de Gestão</h1>
            <p>Cadastro de novos usuários</p>

        </div>

        <section class="login-card">

            <h2>Criar conta</h2>
            <p class="subtitle">
                Preencha os dados para solicitar acesso.
            </p>

            <form id="cadastroForm">

                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                        required>
                </div>

                <div class="form-group">
                    <label for="rf">Registro Funcional (RF)</label>
                    <input
                        type="text"
                        id="rf"
                        placeholder="Digite seu RF"
                        inputmode="numeric"
                        pattern="[0-9]+"
                        autocomplete="username"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>

                    <div class="password-container">
                        <input
                            type="password"
                            id="senha"
                            placeholder="Mínimo de 8 caracteres"
                            minlength="8"
                            autocomplete="new-password"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="senha">
                            Mostrar
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <div class="password-container">
                        <input
                            type="password"
                            id="confirmarSenha"
                            placeholder="Repita sua senha"
                            minlength="8"
                            autocomplete="new-password"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirmarSenha">
                            Mostrar
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    Solicitar cadastro
                </button>

                <div id="mensagem" role="status"></div>

            </form>

            <div class="divider"></div>

            <div class="register">
                Já possui uma conta?
                <a href="index.html">Voltar ao login</a>
            </div>

        </section>

        <footer>
            Sistema de Gestão &bull; Versão 1.0
        </footer>

    </main>

    <script>

        const mensagem = document.getElementById("mensagem");

        // Mostrar ou ocultar senhas

        document.querySelectorAll(".toggle-password")
            .forEach(function (botao) {

                botao.addEventListener("click", function () {

                    const campo = document.getElementById(
                        botao.dataset.target
                    );

                    const mostrar = campo.type === "password";

                    campo.type = mostrar ? "text" : "password";

                    botao.textContent = mostrar
                        ? "Ocultar"
                        : "Mostrar";

                });

            });

        // Validação do cadastro

        document.getElementById("cadastroForm")
            .addEventListener("submit", function (event) {

                event.preventDefault();

                const nome = document.getElementById("nome").value.trim();
                const rf = document.getElementById("rf").value.trim();
                const senha = document.getElementById("senha").value;
                const confirmarSenha = document.getElementById(
                    "confirmarSenha"
                ).value;

                mensagem.className = "erro";

                if (nome.split(/\s+/).length < 2) {
                    mensagem.textContent = "Informe seu nome completo.";
                    return;
                }

                if (!/^\d+$/.test(rf)) {
                    mensagem.textContent = "Informe um RF válido.";
                    return;
                }

                if (senha.length < 8) {
                    mensagem.textContent =
                        "A senha deve possuir no mínimo 8 caracteres.";
                    return;
                }

                if (senha !== confirmarSenha) {
                    mensagem.textContent = "As senhas não coincidem.";
                    return;
                }

                mensagem.className = "";

                mensagem.textContent =
                    "Dados validados. O banco de dados ainda não foi conectado.";

            });

    </script>

</body>
</html>
