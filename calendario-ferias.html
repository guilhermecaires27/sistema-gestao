<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendário de férias | Sistema de Gestão</title><link rel="stylesheet" href="layout.css">
<style>
.cal-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px}.cal-toolbar h2{flex:1;min-width:140px;margin:0;text-transform:capitalize}.cal-filtros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}.cal-filtros label{font-size:13px;font-weight:600}.cal-filtros input,.cal-filtros select{margin-top:6px}.cal-indicadores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}.cal-indicadores .sg-indicador{padding:16px}.cal-indicadores strong{font-size:25px}.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.cal-semana{font-size:12px;color:var(--layout-secondary);text-align:center;padding:7px 0}.cal-dia{font:inherit;text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0;min-height:95px;padding:9px;background:var(--layout-bg);border:1px solid var(--layout-border);border-radius:8px;color:var(--layout-text);cursor:pointer;overflow:hidden}.cal-dia:hover,.cal-dia:focus-visible{border-color:var(--layout-primary);outline:2px solid var(--layout-primary);outline-offset:1px}.cal-dia[aria-pressed=true]{border-color:var(--layout-primary);box-shadow:inset 0 0 0 1px var(--layout-primary)}.cal-dia.hoje .cal-num{color:var(--layout-primary);font-weight:bold}.cal-dia.fds{background:color-mix(in srgb,var(--layout-bg) 75%,var(--layout-secondary))}.cal-num{font-weight:600;font-size:13px}.cal-evento{display:block;font-size:11px;line-height:1.4;border-left:3px solid currentColor;padding:3px 5px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--layout-card)}.cal-aprovado{color:var(--layout-success)}.cal-pendente{color:var(--layout-warning)}.cal-em_analise{color:#60a5fa}.cal-recusado{color:var(--layout-danger)}[data-tema=claro] .cal-em_analise{color:#1d4ed8}.cal-legenda{display:flex;flex-wrap:wrap;gap:16px;margin:14px 0;font-size:12px}.cal-legenda span:before{content:"";display:inline-block;background:currentColor;width:9px;height:9px;border-radius:50%;margin-right:6px}.cal-registro{border-bottom:1px solid var(--layout-border);padding:14px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.cal-registro:last-child{border-bottom:0}.cal-registro strong{display:block;overflow-wrap:anywhere}.cal-registro p{font-size:13px;color:var(--layout-secondary);margin:6px 0}.cal-detalhes{margin-top:20px}.cal-mais{font-size:11px;color:var(--layout-secondary)}.cal-vazio{min-width:0}.cal-contagem{display:none}
@media(max-width:750px){.cal-filtros{grid-template-columns:1fr}.cal-grid{gap:3px}.cal-dia{min-height:55px;padding:5px;gap:3px}.cal-evento,.cal-mais{display:none}.cal-contagem{display:block;font-size:10px;color:var(--layout-secondary)}.cal-indicadores{grid-template-columns:1fr}.cal-toolbar h2{flex-basis:100%}}
</style></head><body class="sg-body"><div id="carregando" class="sg-carregando">Verificando sessão...</div><div id="app" hidden>
<header class="sg-cabecalho"><h1>Calendário geral de férias</h1><p>Planejamento e consulta dos períodos de férias dos funcionários.</p></header>
<section class="sg-card"><div class="cal-toolbar"><h2 id="mesTitulo"></h2><button id="anterior" class="sg-btn sg-btn-secondary" type="button" aria-label="Mês anterior">‹</button><button id="hoje" class="sg-btn sg-btn-secondary" type="button">Hoje</button><button id="proximo" class="sg-btn sg-btn-secondary" type="button" aria-label="Próximo mês">›</button><button id="atualizar" class="sg-btn sg-btn-secondary" type="button">Atualizar</button></div>
<div class="cal-filtros"><label>Funcionário ou RF<input id="busca" class="sg-input" placeholder="Pesquisar nome ou RF"></label><label>Secretaria<select id="secretaria" class="sg-input"><option value="">Todas</option></select></label><label>Situação<select id="situacao" class="sg-input"><option value="aprovado" selected>Aprovadas</option><option value="">Todas</option><option value="pendente">Pendentes</option><option value="em_analise">Em análise</option><option value="recusado">Recusadas</option></select></label></div>
<div class="cal-indicadores"><div class="sg-indicador"><span>Funcionários no filtro</span><strong id="totalFunc">—</strong></div><div class="sg-indicador"><span>Períodos no mês</span><strong id="totalPeriodos">—</strong></div><div class="sg-indicador"><span>Maior simultaneidade</span><strong id="pico">—</strong></div></div>
<div class="cal-legenda"><span class="cal-aprovado">Aprovadas</span><span class="cal-pendente">Pendentes</span><span class="cal-em_analise">Em análise</span><span class="cal-recusado">Recusadas</span></div>
<p id="statusCal" role="status"></p><div id="calGrid" class="cal-grid"></div></section>
<section class="sg-card cal-detalhes" id="detalhes"><div class="cal-toolbar"><h2 id="detTitulo">Períodos do mês</h2><button type="button" id="mostrarMes" class="sg-btn sg-btn-secondary" hidden>Ver mês inteiro</button><a href="ferias.html" class="sg-btn">Gerenciar férias</a></div><div id="lista"></div></section>
</div><script type="module" src="./calendario-ferias.js"></script></body></html>
