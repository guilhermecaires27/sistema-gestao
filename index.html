
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sistema de Gestão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-container">

        <div class="login-header">

            <div class="logo">
                <img src="https://www2.praiagrande.sp.gov.br/img/jpg/brasao_prefeitura.png" alt="Brasão de Praia Grande" width="54" height="54" style="width:75%;height:75%;object-fit:contain;display:block" referrerpolicy="no-referrer">
            </div>

            <h1>Sistema de Gestão</h1>
            <p>Área de acesso restrito</p>

        </div>

        <section class="login-card">

            <h2>Bem-vindo</h2>

            <p class="subtitle">
                Insira suas credenciais para continuar.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="rf">Registro Funcional (RF)</label>

                    <input
                        type="text"
                        id="rf"
                        placeholder="Digite seu RF"
                        inputmode="numeric"
                        pattern="[0-9]{1,6}"
                        maxlength="6"
                        autocomplete="username"
                        required>
                </div>

                <div class="form-group">

                    <label for="senha">Senha</label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password">
                            Mostrar
                        </button>

                    </div>

                </div>

                <div class="form-options">
                    <a href="#" id="forgotPassword">
                        Esqueci minha senha
                    </a>
                </div>

                <button type="submit" class="btn-login">
                    Entrar no sistema
                </button>

                <div id="mensagem" role="status"></div>

            </form>

            <div class="divider"></div>

            <div class="register">
                Sistema integrado ao Crachá Digital.
            </div>

        </section>

        <footer>
            Sistema de Gestão &bull; Versão 1.0
        </footer>

    </main>

    <script type="module">

        import { realizarLogin } from "./auth.js";

        const formulario =
            document.getElementById("loginForm");

        const senha =
            document.getElementById("senha");

        const mensagem =
            document.getElementById("mensagem");

        const toggle =
            document.getElementById("togglePassword");

        const botao =
            formulario.querySelector('button[type="submit"]');

        toggle.addEventListener("click", () => {

            const mostrar = senha.type === "password";

            senha.type = mostrar ? "text" : "password";

            toggle.textContent =
                mostrar ? "Ocultar" : "Mostrar";

        });

        formulario.addEventListener("submit", async (event) => {

            event.preventDefault();

            botao.disabled = true;
            botao.textContent = "Validando acesso...";

            mensagem.className = "";
            mensagem.textContent = "Consultando Crachá Digital...";

            try {

                const resultado = await realizarLogin(
                    document.getElementById("rf").value.trim(),
                    senha.value
                );

                if (!resultado.sucesso) {

                    mensagem.className = "erro";
                    mensagem.textContent = resultado.mensagem;

                    return;

                }

                senha.value = "";

                if (resultado.primeiro_acesso) {

                    window.location.replace(
                        "alterar-senha.html"
                    );

                } else {

                    window.location.replace(
                        "dashboard.html"
                    );

                }

            } catch {

                mensagem.className = "erro";
                mensagem.textContent = "Erro ao realizar login.";

            } finally {

                botao.disabled = false;
                botao.textContent = "Entrar no sistema";

            }

        });

        document.getElementById("forgotPassword")
            .addEventListener("click", (event) => {

                event.preventDefault();

                mensagem.className = "";

                mensagem.textContent =
                    "Entre em contato com o administrador.";

            });

    </script>

</body>
</html>
