<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Férias | Sistema de Gestão</title><link rel="stylesheet" href="layout.css">
<style>
.fer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.fer-grid label{display:block;font-weight:600;font-size:14px}.fer-grid .sg-input{width:100%;margin-top:8px}.fer-wide{grid-column:1/-1}.fer-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.fer-summary{white-space:pre-line;line-height:1.7;padding:16px;border:1px solid var(--layout-border,#64748b);border-radius:8px;margin-top:18px}.fer-history{margin-top:24px}.fer-scroll{overflow:auto}.fer-table{width:100%;border-collapse:collapse;white-space:nowrap}.fer-table th,.fer-table td{text-align:left;padding:12px;border-bottom:1px solid var(--layout-border,#64748b)}.fer-muted{font-size:13px;opacity:.8}.fer-grid [hidden],[hidden]{display:none!important}@media(max-width:650px){.fer-grid{grid-template-columns:1fr}}
</style></head><body class="sg-body"><div id="carregando" class="sg-carregando">Verificando sessão...</div><div id="app" hidden>
<header class="sg-cabecalho"><h1>Férias</h1><p>Solicitação e acompanhamento de férias.</p></header>
<section class="sg-card"><h2>Solicitação de férias</h2><p class="fer-muted" id="prazo" role="status">Carregando calendário...</p>
<form id="formFerias"><fieldset id="campos" disabled style="border:0;padding:0;margin:0;min-width:0"><div class="fer-grid">
<label>RF<input id="rf" class="sg-input" readonly></label><label>Nome<input id="nome" class="sg-input" readonly></label><label>Cargo<input id="cargo" class="sg-input" readonly></label><label>Secretaria<input id="secretaria" class="sg-input" readonly></label>
<label>Duração<select id="dias" class="sg-input" required><option value="">Selecione</option><option value="15">15 dias</option><option value="30">30 dias</option></select></label>
<label>Início do primeiro período<input id="inicio1" type="date" class="sg-input" required min="2026-01-01" max="2027-12-31"></label>
<label class="fer-wide" id="opcaoSegundo" hidden><input type="checkbox" id="segundo"> Adicionar segundo período de 15 dias em outro mês</label>
<label id="blocoInicio2" hidden>Início do segundo período<input id="inicio2" type="date" class="sg-input" disabled max="2027-12-31"></label></div>
<div id="resumo" class="fer-summary" role="status">Escolha a duração e a data inicial.</div>
<div class="fer-actions"><button type="submit" id="registrar" class="sg-btn" disabled>Registrar férias</button><button type="button" id="limpar" class="sg-btn sg-btn-secondary">Limpar campos</button></div></fieldset></form></section>
<section class="sg-card fer-history"><h2 id="tituloHistorico">Minhas solicitações</h2><p class="fer-muted">Os registros são solicitações, não aprovação de férias.</p><div class="fer-actions"><input id="pesquisa" class="sg-input" placeholder="Pesquisar RF, nome ou data" aria-label="Pesquisar solicitações"><button id="atualizar" class="sg-btn sg-btn-secondary" type="button">Atualizar</button></div><p id="statusHistorico" role="status"></p><div class="fer-scroll"><table class="fer-table"><thead><tr><th>RF</th><th>Nome</th><th>Primeiro período</th><th>Retorno</th><th>Segundo período</th><th>Retorno</th><th>Total</th><th id="thAcoes" hidden>Ações</th></tr></thead><tbody id="historico"></tbody></table></div><div class="fer-actions"><button id="anterior" type="button" class="sg-btn sg-btn-secondary" disabled>Anterior</button><button id="proxima" type="button" class="sg-btn sg-btn-secondary" disabled>Próxima</button></div></section>
</div><script type="module" src="./ferias.js"></script></body></html>
