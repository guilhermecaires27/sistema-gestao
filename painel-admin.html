<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel administrativo | Sistema de Gestão</title><link rel="stylesheet" href="layout.css"><style>.ind-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}.ind-card{padding:20px;border:1px solid var(--layout-border);background:var(--layout-card);border-radius:12px;color:var(--layout-text);text-decoration:none}.ind-card strong{display:block;font-size:32px;margin:12px 0 0;color:var(--layout-text)}.ind-card span{color:var(--layout-secondary);font-size:14px}.ind-bar{display:grid;grid-template-columns:75px 1fr 36px;gap:12px;align-items:center;margin:14px 0}.ind-track{height:14px;background:var(--layout-bg);border-radius:6px;overflow:hidden}.ind-fill{height:100%;background:#3b82f6;border-radius:6px}.ind-actions{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}</style></head><body class="sg-body"><div id="carregando" class="sg-carregando">Verificando sessão...</div><div id="app" hidden><header class="sg-cabecalho"><h1>Painel administrativo</h1><p>Indicadores de usuários e solicitações de férias.</p></header><div class="ind-actions"><button id="atualizarIndicadores" class="sg-btn sg-btn-secondary">Atualizar indicadores</button><a class="sg-btn" href="ferias.html?status=pendentes">Analisar solicitações</a></div><p id="indStatus" role="status"></p><section id="indicadores" class="ind-grid"></section><section class="sg-card" style="margin-top:24px"><h2>Solicitações de férias por mês</h2><p>Últimos seis meses, por data de registro.</p><div id="grafico"></div></section></div><script type="module">
import {montarLayout} from './layout.js';
import {supabase} from './supabase.js';
const $=id=>document.getElementById(id);
async function carregar(){const btn=$('atualizarIndicadores');btn.disabled=true;$('indStatus').textContent='Carregando...';try{const {data,error}=await supabase.rpc('indicadores_portal');if(error)throw error;const campos=[['usuarios','Usuários cadastrados','admin.html'],['ativos','Usuários ativos','admin.html'],['pendentes','Férias aguardando decisão','ferias.html?status=pendentes'],['aprovadas','Solicitações aprovadas','ferias.html?status=aprovado'],['recusadas','Solicitações recusadas','ferias.html?status=recusado'],['em_ferias','Funcionários em férias hoje','ferias.html?status=aprovado']];$('indicadores').replaceChildren();for(const [k,t,href] of campos){const a=document.createElement('a');a.className='ind-card';a.href=href;const l=document.createElement('span');l.textContent=t;const v=document.createElement('strong');v.textContent=Number(data[k]).toLocaleString('pt-BR');a.append(l,v);$('indicadores').append(a);}const meses=[];const atual=new Date(new Date().toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'})+'T12:00:00');const hoje=new Date();const partes=new Intl.DateTimeFormat('en-US',{timeZone:'America/Sao_Paulo',year:'numeric',month:'numeric'}).formatToParts(hoje);const ano=Number(partes.find(p=>p.type==='year').value),mes=Number(partes.find(p=>p.type==='month').value);for(let i=5;i>=0;i--){const d=new Date(Date.UTC(ano,mes-1-i,1));const chave=d.toISOString().slice(0,7);meses.push({mes:chave,total:Number(data.mensal?.find(x=>x.mes===chave)?.total||0)});}const max=Math.max(1,...meses.map(x=>x.total));$('grafico').replaceChildren();for(const m of meses){const row=document.createElement('div');row.className='ind-bar';const label=document.createElement('span');label.textContent=m.mes.slice(5)+'/'+m.mes.slice(0,4);const track=document.createElement('div');track.className='ind-track';const fill=document.createElement('div');fill.className='ind-fill';fill.style.width=(m.total/max*100)+'%';track.append(fill);const num=document.createElement('strong');num.textContent=m.total;row.append(label,track,num);$('grafico').append(row);}$('indStatus').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR');}catch(e){$('indStatus').textContent='Erro ao consultar indicadores: '+e.message;}finally{btn.disabled=false;}}
const perfil=await montarLayout({titulo:'Painel administrativo',pagina:'painel-admin',somenteAdmin:true});if(perfil){$('atualizarIndicadores').onclick=carregar;await carregar();}
</script></body></html>
